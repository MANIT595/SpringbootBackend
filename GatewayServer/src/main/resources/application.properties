server.port=9191

management.endpoint.gateway.enabled=true
management.endpoints.web.exposure.include=gateway

spring.application.name=gateway-server

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true


# Configure Spring Cloud Gateway to apply the AuthenticationFilter globally
spring.cloud.gateway.default-filters[0].name=AuthenticationFilter
spring.cloud.gateway.default-filters[1].name=LoggingFilter

#
#spring.cloud.gateway.routes[0].id=user-service-id
#spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
#spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**
##spring.cloud.gateway.routes[0].filters[0]=AuthenticationFilter
#spring.cloud.gateway.routes[0].filters[0]=AuthenticationFilter
#
#spring.cloud.gateway.routes[1].id=product-service-id
#spring.cloud.gateway.routes[1].uri=lb://PRODUCT-SERVICE
#spring.cloud.gateway.routes[1].predicates[0]=Path=/api/products/**
#spring.cloud.gateway.routes[1].filters[0]=AuthenticationFilter
#
#spring.cloud.gateway.routes[2].id=order-service-id
#spring.cloud.gateway.routes[2].uri=lb://ORDER-SERVICE
#spring.cloud.gateway.routes[2].predicates[0]=Path=/api/orders/**

eureka.instance.client.serverUrl.defaultZone = http://localhost:8761/eureka/
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/

spring.sleuth.enabled=true
spring.sleuth.web.client.enabled=true
spring.sleuth.web.servlet.enabled=true

# Configure Zipkin (if using)
spring.zipkin.enabled=true
spring.zipkin.base-url=http://localhost:9411/  # Zipkin server URL
management.tracing.enabled=true
# Zipkin server URL
#spring.zipkin.base-url=http://localhost:9411
spring.sleuth.sampler.probability=1.0
# Set to 1.0 to sample all requests


#adding micrometer instead of sleuth
management.tracing.sampling.probability=1.0
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.level.org.springframework.web=INFO





