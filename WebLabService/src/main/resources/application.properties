spring.application.name=weblab-service


spring.datasource.url=jdbc:mysql://localhost:3306/microservices
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update


# Zipkin server URL
spring.zipkin.base-url=http://localhost:9411
spring.sleuth.sampler.probability=1.0
# Set to 1.0 to sample all requests


#adding micrometer instead of sleuth
management.tracing.sampling.probability=1.0
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.level.root = info

logging.file.name= /Users/saimanikantatelagamsetty/Downloads/GitDemo-microservice_communication/weblabService.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} - %p - %c{1} - %m%n